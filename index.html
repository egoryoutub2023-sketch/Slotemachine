<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слот-Машина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slot-machine {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 3px solid gold;
            box-shadow: 0 0 50px rgba(255,215,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: gold;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .slots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            background: #2c3e50;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #34495e;
        }
        .slot {
            width: 100px;
            height: 120px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 3px solid #bdc3c7;
        }
        .reel {
            position: absolute;
            width: 100%;
            transition: transform 0.1s;
        }
        .symbol {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border-bottom: 2px solid #bdc3c7;
        }
        button {
            background: #e74c3c;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
        }
        .result {
            color: white;
            font-size: 1.2em;
            margin: 15px 0;
        }
        .score {
            color: gold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <h1>🎰 СЛОТ-МАШИНА</h1>
        <div class="slots-container">
            <div class="slot" id="slot1">
                <div class="reel">
                    <div class="symbol">🍒</div>
                    <div class="symbol">🍋</div>
                    <div class="symbol">🍊</div>
                    <div class="symbol">🍇</div>
                    <div class="symbol">🔔</div>
                </div>
            </div>
            <div class="slot" id="slot2">
                <div class="reel">
                    <div class="symbol">🍒</div>
                    <div class="symbol">🍋</div>
                    <div class="symbol">🍊</div>
                    <div class="symbol">🍇</div>
                    <div class="symbol">🔔</div>
                </div>
            </div>
            <div class="slot" id="slot3">
                <div class="reel">
                    <div class="symbol">🍒</div>
                    <div class="symbol">🍋</div>
                    <div class="symbol">🍊</div>
                    <div class="symbol">🍇</div>
                    <div class="symbol">🔔</div>
                </div>
            </div>
        </div>
        <button onclick="spinSlots()">КРУТИТЬ</button>
        <div class="result" id="result">Нажмите кнопку!</div>
        <div class="score">Счёт: <span id="score">100</span></div>
    </div>

    <script>
        let score = 100;
        
        function spinSlots() {
            if (score < 10) {
                document.getElementById('result').textContent = 'Нет денег!';
                return;
            }
            score -= 10;
            document.getElementById('score').textContent = score;
            
            document.getElementById('result').textContent = 'Крутим...';
            
            const symbols = ['🍒', '🍋', '🍊', '🍇', '🔔'];
            const results = [];
            
            // Анимация вращения
            let spins = 0;
            const spinInterval = setInterval(() => {
                document.querySelectorAll('.reel').forEach(reel => {
                    reel.style.transform = `translateY(${Math.random() * -500}px)`;
                });
                spins++;
                if (spins > 20) {
                    clearInterval(spinInterval);
                    showResult();
                }
            }, 100);
            
            function showResult() {
                const finalResults = [];
                document.querySelectorAll('.slot').forEach(slot => {
                    const randomIndex = Math.floor(Math.random() * symbols.length);
                    const reel = slot.querySelector('.reel');
                    reel.style.transform = `translateY(${randomIndex * -100}px)`;
                    finalResults.push(symbols[randomIndex]);
                });
                
                // Проверка выигрыша
                if (finalResults[0] === finalResults[1] && finalResults[1] === finalResults[2]) {
                    score += 30;
                    document.getElementById('result').textContent = 'Выигрыш! +30';
                } else if (finalResults[0] === finalResults[1] || finalResults[1] === finalResults[2]) {
                    score += 15;
                    document.getElementById('result').textContent = 'Удача! +15';
                } else {
                    document.getElementById('result').textContent = 'Повезёт в следующий раз!';
                }
                document.getElementById('score').textContent = score;
            }
        }
    </script>
</body>
</html>
